{{- if not (or .Values.hcloud.token .Values.hcloud.existingSecret) }}
{{- fail "hcloud.token or hcloud.existingSecret must be set to provide the Hetzner Cloud API token" }}
{{- end }}
{{- if and .Values.hcloud.token (not .Values.hcloud.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hetzner-node-watchdog.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hetzner-node-watchdog.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "hetzner-node-watchdog.secretKey" . }}: {{ .Values.hcloud.token | quote }}
{{- end }}
