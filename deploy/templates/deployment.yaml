{{/*
Renders one Deployment. Takes a dict: "root" (the chart's root context),
"suffix" ("primary" or "secondary"), and "config" (the resolved config.*
values for this instance).
*/}}
{{- define "hetzner-node-watchdog.deployment" -}}
{{- $root := .root -}}
{{- $suffix := .suffix -}}
{{- $config := .config -}}
{{- $autoAffinity := dict -}}
{{- if $root.Values.secondary.enabled -}}
{{- $antiAffinityLabels := include "hetzner-node-watchdog.selectorLabels" $root | fromYaml -}}
{{- $autoAffinity = dict "podAntiAffinity" (dict "requiredDuringSchedulingIgnoredDuringExecution" (list (dict "topologyKey" "kubernetes.io/hostname" "labelSelector" (dict "matchLabels" $antiAffinityLabels)))) -}}
{{- end -}}
{{- $affinity := merge (deepCopy ($root.Values.affinity | default dict)) $autoAffinity -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hetzner-node-watchdog.instanceFullname" (list $root $suffix) }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "hetzner-node-watchdog.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $suffix }}
spec:
  # Exactly one replica per instance: restart scheduling is kept in memory
  # per pod with no leader election, so running more than one pod per
  # instance risks duplicate/racing restart attempts. Use secondary.enabled
  # for redundancy instead of scaling this up.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hetzner-node-watchdog.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $suffix }}
  template:
    metadata:
      labels:
        {{- include "hetzner-node-watchdog.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $suffix }}
        {{- with $root.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $root.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "hetzner-node-watchdog.serviceAccountName" $root }}
      {{- with $root.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $affinity }}
      affinity:
        {{- toYaml $affinity | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $root.Chart.Name }}
          image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          env:
            # gonfig reads this directly (EnvPrefix "NODE_WATCHDOG_" + id
            # "hcloud-token"); kept out of args entirely so the token never
            # appears in the pod spec or process argv at all.
            - name: NODE_WATCHDOG_HCLOUD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "hetzner-node-watchdog.secretName" $root }}
                  key: {{ include "hetzner-node-watchdog.secretKey" $root }}
          # Builds and runs the app straight from its flake on every pod start
          # (no pre-built image); the "--" hands everything after it to the
          # binary itself. Each arg below corresponds 1:1 to a CLI flag of the
          # application (see internal/config/config.go).
          command:
            - nix
          args:
            - run
            - --extra-experimental-features
            - flakes
            - --extra-experimental-features
            - nix-command
            - {{ $root.Values.flakeRef }}
            - --
            - --log-level={{ $config.logLevel }}
            - --node-label-selector={{ $config.nodeLabelSelector }}
            - --ignore-cordoned={{ $config.ignoreCordoned }}
            {{- if $config.ignoreNodeLabelSelector }}
            - --ignore-node-label-selector={{ join "," $config.ignoreNodeLabelSelector }}
            {{- end }}
            {{- if $config.ignoreNodeTaintSelector }}
            - --ignore-node-taint-selector={{ join "," $config.ignoreNodeTaintSelector }}
            {{- end }}
            - --timeout-duration={{ $config.timeoutDuration }}
            - --grace-period={{ $config.gracePeriod }}
            - --poll-interval={{ $config.pollInterval }}
            - --port={{ $config.healthListenPort }}
          ports:
            - name: http-health
              containerPort: {{ $config.healthListenPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http-health
            periodSeconds: {{ $root.Values.probes.startupPeriodSeconds }}
            failureThreshold: {{ $root.Values.probes.startupFailureThreshold }}
          # /healthz always returns 200 once the process is up; /readyz only turns
          # healthy once the node informer has completed its initial sync (see
          # internal/health and nodecontroller.Controller.HasSynced).
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-health
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-health
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml $root.Values.resources | nindent 12 }}
{{- end -}}

{{ include "hetzner-node-watchdog.deployment" (dict "root" . "suffix" "primary" "config" .Values.config) }}
{{- if .Values.secondary.enabled }}
---
{{ include "hetzner-node-watchdog.deployment" (dict "root" . "suffix" "secondary"
     "config" (merge (deepCopy .Values.secondary.config) .Values.config)) }}
{{- end }}
